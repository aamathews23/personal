name: Battleship - Verify PR
on:
  pull_request:
    paths:
      - 'packages/battleship/**'
env:
  RUSTFLAGS: "-Dwarnings"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Build
        run: cargo build -p battleship
      - name: Test
        run: cargo test -p battleship
      - name: Lint
        run: cargo clippy -p battleship
