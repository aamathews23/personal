name: Battleship Web - Verify PR
on:
  pull_request:
    paths:
      - 'packages/battleship_web/**'
env:
  RUSTFLAGS: "-Dwarnings"
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.76.0"
          target: wasm32-unknown-unknown
          components: clippy
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh -s -- -f
      - name: Build
        run: cargo build -p battleship_web
      - name: Test
        run: cargo test -p battleship_web
      - name: Lint
        run: cargo clippy -p battleship_web
      - name: Build WASM
        run: wasm-pack build packages/battleship_web --target web --out-dir ../packages/battleship_web/dist
